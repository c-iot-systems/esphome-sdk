substitutions:
  # On criotive's mounted listeners the device subscribes to the bare topic and
  # the broker scopes it under the cloud id. Brokers without a mountpoint can
  # override this with a device-prefixed topic for bench testing.
  location_system_command_topic: command

external_components:
  - source:
      type: git
      url: https://github.com/c-iot-systems/esphome-sdk
      ref: ${sdk_ref}
    components: [google_location, ack_button]

text_sensor:
  - platform: google_location
    name: "Google location"
    id: id_google_location
    internal: true
    system_command_topic: ${location_system_command_topic}
    update_interval: never

button:
  # ack_button, not template: a location request is asked for remotely, so the
  # caller needs to know the device heard it. The scan result is published as
  # canonical location_parameters telemetry; this button remains an alternate
  # trigger for Home Assistant clients while the platform uses fetch_location.
  - platform: ack_button
    name: "Location Request"
    id: button_google_location
    on_press:
      - then:
          - lambda: |-
              id(id_google_location).update();
