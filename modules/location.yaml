substitutions:
  # Deprecated compatibility path for the legacy JSON fetch_location command.
  # New callers must publish PRESS to the discovered Location Request ack_button
  # command topic and observe PRESS on its state topic. On mounted listeners the
  # broker scopes this bare legacy topic under the cloud id.
  location_system_command_topic: command

external_components:
  - source:
      type: git
      url: https://github.com/c-iot-systems/esphome-sdk
      ref: ${sdk_ref}
    components: [google_location, ack_button]

text_sensor:
  - platform: google_location
    name: "Google location"
    id: id_google_location
    internal: true
    system_command_topic: ${location_system_command_topic}
    update_interval: never

button:
  # Canonical remote trigger. ack_button publishes PRESS on its state topic
  # before the scan starts, so the caller can confirm that the device received
  # the command. The scan result follows as canonical location_parameters
  # telemetry.
  - platform: ack_button
    name: "Location Request"
    id: button_google_location
    on_press:
      - then:
          - lambda: |-
              id(id_google_location).update();
