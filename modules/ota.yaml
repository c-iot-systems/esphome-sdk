# ota.yaml — over-the-air updates: safe_mode, both OTA platforms, HTTP OTA, status, and rollback.
#
# Owns: `safe_mode`, the two OTA platforms (esphome + http_request), `http_request`, the ota_status
# text sensor, the OTA-trigger text entities, the `perform_ota_update` script (with the device-name
# guard) and the `script_rollback` rollback watchdog. Required input scoped to THIS module (see the
# contract in core.yaml): importing ota.yaml makes ota_password and ota_http_server mandatory —
# neither has a default. ota_attempts is the optional input this module owns.
#
# Required inputs use the guard idiom `${ x if x is defined else 1/0 }` (present -> the value;
# missing -> a hard `esphome config` failure naming the variable). See core.yaml's header / the
# README; tests/negative/ proves each omission fails.
#
# ── Rollback watchdog (offline-survival audit) ────────────────────────────────────────────────
# on_boot arms `script_rollback`: a 300s timer that, on ESP-IDF, rolls the device back to the
# previous image. criotive_mqtt.yaml's on_connect cancels that timer and marks the running image
# valid once the broker is reached — reaching MQTT is the health signal that a freshly-flashed build
# works. The script lives HERE; the cancel lives in criotive_mqtt.yaml and references it by id. On
# the Arduino framework there is no rollback API, so both halves compile to no-ops there; the guard
# below matters only on the esp-idf build.
#
# AUDIT (required by the offline-survival invariant — see core.yaml): may this watchdog reboot a
# HEALTHY, CONFIRMED image that is merely long-offline? It fires 300s after EVERY boot unless MQTT
# connects, so the risk window is the 5 minutes after any power-cycle — precisely the case of a device
# that power-cycles during an outage and cannot reach the broker (power returns, site network still
# down). The reboot call is the crux. Read against
# ESP-IDF (esp_ota_ops.c), `esp_ota_mark_app_invalid_rollback_and_reboot()` calls
# `esp_ota_current_ota_is_workable(false)`, whose `valid == false` branch does NOT inspect the
# running partition's OTA state: as long as the app runs from an OTA slot and
# `esp_ota_check_rollback_is_possible()` is true (a bootable app sits in the other slot — true for any
# device OTA-updated at least once), it marks the CURRENT partition INVALID and `esp_restart()`s —
# even a partition already ESP_OTA_IMG_VALID. So the UNGUARDED call WOULD roll back and reboot a
# confirmed, healthy device that power-cycles and cannot reach the broker within 300s: a connectivity-
# driven reboot AND a silent firmware downgrade — a VIOLATION of the invariant. (Inert on Arduino;
# live on ESP-IDF, which the SDK targets.)
#
# FIX: gate the rollback on the running image genuinely being pending post-OTA verification —
# `esp_ota_get_state_partition(running) == ESP_OTA_IMG_PENDING_VERIFY` — mirroring ESP-IDF's own
# idiom in `esp_ota_begin` (esp_ota_ops.c:139-143). A confirmed image (ESP_OTA_IMG_VALID), which is
# the state of any device that reached the broker at least once since its last OTA, is NEVER
# invalidated by this watchdog; only a freshly-flashed image still awaiting its first successful
# broker connection can roll back — the watchdog's intended purpose. OTA safety is preserved (a bad
# OTA that never reaches the broker still rolls back) while a healthy device survives indefinite
# offline operation.
#
# ── Test/prod OTA host selection ──────────────────────────────────────────────────────────────
# A build can be routed to one of two download hosts — a production host and a separate test/staging
# host — by detecting a `.test` token in the requested version name. `.test` is NOT necessarily the
# last suffix, because version names are sorted (e.g. `v1.6.test.verbose`), so a naive
# endswith(".test") is wrong; the whole-segment detection below handles that. The substitution
# contract defines a single required OTA host,
# `ota_http_server`; to keep the two-host selection without inventing a second REQUIRED input, the
# test host is an OPTIONAL `ota_http_server_test` that DEFAULTS to ${ota_http_server}. A single-host
# device therefore routes both branches to the same host; a deployment with a separate staging server
# overrides ota_http_server_test. No new credential and no new required input are introduced.
#
# ── OTA visual feedback is not here ────────────────────────────────────────────────────────────
# This module drives no indicator-LED feedback in its OTA handlers: a hardware file owns its own OTA
# visual feedback by its own ids; no shared module reaches into a hardware id.
#
# ── perform_ota_update is the only OTA-trigger path ────────────────────────────────────────────
# The single way to trigger a download-and-flash is perform_ota_update, and it is guarded: it only
# flashes a binary whose name starts with `${device_name}_` and is not a `.factory` image (see the
# script below). There is deliberately no second, unguarded flash entity that would let an arbitrary
# host or an arbitrary binary name bypass that guard.

substitutions:
  # 50 safe-mode boot attempts before giving up. ESPHome's stock default is 5, which surrenders 10x
  # sooner; a field device on an unreliable uplink deserves the larger recovery budget. Overridable
  # per device.
  ota_attempts: "50"
  # Optional test/staging OTA host; defaults to the single required prod host (see header).
  ota_http_server_test: ${ota_http_server}

safe_mode:
  num_attempts: ${ota_attempts}

esphome:
  on_boot:
    # Explicit list syntax. Arm the rollback watchdog as early as the other priority-600 boot work;
    # criotive_mqtt.yaml's on_connect disarms it once the broker is reached.
    - priority: 600
      then:
        - script.execute: script_rollback

ota:
  - platform: esphome
    password: "${ ota_password if ota_password is defined else 1/0 }"

  - platform: http_request
    on_begin:
      - text_sensor.template.publish:
          id: ota_status
          state: "OTA start"
    on_progress:
      - lambda: |-
          char buffer[50];
          snprintf(buffer, sizeof(buffer), "OTA progress %0.1f%%", x);
          id(ota_status).publish_state(buffer);
    on_end:
      - text_sensor.template.publish:
          id: ota_status
          state: "OTA end"
      - delay: 1s  # Wait for MQTT to publish the text response
    on_error:
      - lambda: |-
          char buffer[50];
          snprintf(buffer, sizeof(buffer), "OTA update error %d", x);
          id(ota_status).publish_state(buffer);

http_request:
  verify_ssl: false  # TODO: turn this on

text:
  - platform: template
    name: "OTA HTTPS prod"
    id: ota_https_prod
    optimistic: true
    min_length: 0
    max_length: 255
    mode: text
    on_value:
      - delay: 1s  # Wait for MQTT to publish the text response
      - script.execute:
          id: perform_ota_update
          binary_name: !lambda 'return x;'
          # Pick the server the requested version actually lives on: a test release (`.test`) is only
          # uploaded to the test/staging host, a production release only to the prod host, so asking
          # the wrong host answers 404 and the OTA dies at download. `.test` is not necessarily the last
          # suffix (version names are sorted, e.g. `v1.6.test.verbose`), so detect the `.test` token
          # only when it is a whole dotted segment — never a naive endswith.
          server_prefix: !lambda |-
            bool is_test = false;
            for (size_t pos = x.find(".test"); pos != std::string::npos;
                 pos = x.find(".test", pos + 1)) {
              const size_t end = pos + 5;
              if (end == x.size() || x[end] == '.') {
                is_test = true;
                break;
              }
            }
            return std::string("https://") +
                   (is_test ? "${ ota_http_server_test if ota_http_server_test is defined else 1/0 }"
                            : "${ ota_http_server if ota_http_server is defined else 1/0 }");

text_sensor:
  - platform: template
    name: "OTA status"
    id: ota_status
    update_interval: never

script:
  - id: perform_ota_update
    parameters:
      server_prefix: string
      binary_name: string
    then:
      - if:
          condition:
            # Device-name guard: only flash a binary whose name starts with "${device_name}_" and is
            # not a `.factory` image. A binary built for another device is rejected into an error
            # state, never flashed. ${device_name} substitutes to the literal device name (the device
            # name is a YAML substitution, not a C++ define).
            - lambda: 'return binary_name.find("${device_name}_") == 0 && binary_name.find(".factory") == std::string::npos;'
          then:
            - ota.http_request.flash:
                md5_url: !lambda 'return server_prefix + binary_name + ".bin.md5";'
                url: !lambda 'return server_prefix + binary_name + ".bin";'
          else:
            - lambda: |-
                id(ota_status).publish_state("Error: this version is for another device");

  - id: script_rollback
    then:
      - delay: 300s
      - lambda: |-
          #ifdef USE_ESP_IDF
            // Offline-survival guard (see header): roll back ONLY an image still pending
            // post-OTA verification. esp_ota_mark_app_invalid_rollback_and_reboot() does NOT check
            // the OTA state itself and would invalidate+reboot even a CONFIRMED image whenever a
            // rollback target exists — so a healthy, long-offline device that power-cycles and can't
            // reach the broker within 300s would be rolled back. Gating on ESP_OTA_IMG_PENDING_VERIFY
            // (ESP-IDF's own idiom in esp_ota_begin) means a confirmed image is never touched here;
            // only a freshly-flashed, not-yet-verified image can roll back — the watchdog's purpose.
            const esp_partition_t *running = esp_ota_get_running_partition();
            esp_ota_img_states_t ota_state;
            if (esp_ota_get_state_partition(running, &ota_state) == ESP_OK &&
                ota_state == ESP_OTA_IMG_PENDING_VERIFY) {
              esp_ota_mark_app_invalid_rollback_and_reboot();
            }
          #endif
