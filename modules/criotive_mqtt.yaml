  mqtt_client_id: ${device_name}
  # Never reboot solely because MQTT is unavailable.
  mqtt_reboot_timeout: 0s
  mqtt_discovery: "true"

mqtt:
  id: mqtt_client
  broker: "${ 'broker.criotive.io' if criotive_env_selected == 'prod' else 'dev-hmg.c-iot.io' if criotive_env_selected == 'hmg' else 1/0 }"
  # Both deployments listen for TLS on 8883. The port alone does not enable TLS — ESPHome calls
  # set_ca_certificate only when `certificate_authority` is present — so the anchor below, not this
  # number, is what makes the transport encrypted.
  port: 8883
  username: "${ mqtt_username if mqtt_username is defined else 1/0 }"
  password: "${ mqtt_password if mqtt_password is defined else 1/0 }"
  certificate_authority: "${ criotive_ca_prod if criotive_env_selected == 'prod' else criotive_ca_hmg if criotive_env_selected == 'hmg' else 1/0 }"
  reboot_timeout: ${mqtt_reboot_timeout}
  discovery: ${mqtt_discovery}
  discover_ip: false
  client_id: ${mqtt_client_id}
  topic_prefix: ${device_name}
  birth_message:
    topic: ${device_name}/status
    payload: online
    qos: 0
    retain: true
  will_message:
    topic: ${device_name}/status
    payload: offline
    qos: 0
    retain: true
  shutdown_message:
    topic: ${device_name}/status
    payload: offline
    qos: 0
    retain: true
  log_topic: # Publishing logs is opt-in.
  on_connect:
    - then:
        - delay: 2s
        - lambda: |-
            // Rollback confirmation is available only with ESP-IDF.
            #ifdef USE_ESP_IDF
              if (id(mqtt_client).is_connected()) {
                id(script_rollback).stop();
                esp_ota_mark_app_valid_cancel_rollback();
              }
            #endif
