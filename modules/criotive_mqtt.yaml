substitutions:
  # The deployment this device talks to: `prod` or `hmg`. It is the ONLY broker knob — host, TLS
  # port and trust anchor are all derived from it below, so an SDK device cannot be pointed at a
  # broker we do not run without editing its own config outside the package.
  #
  # Two failure modes, both loud and both at validation time rather than at runtime:
  #   * the substitution is missing  -> this guard divides by zero, naming `criotive_env`;
  #   * the value is not one we know -> the `else 1/0` branch of each mapping below does the same.
  criotive_env_selected: "${ criotive_env if criotive_env is defined else 1/0 }"

  # Trust anchors, one per environment, taken from the self-signed root each broker presents in its
  # own TLS chain. They are NOT interchangeable: prod is `CN = c-iot Hub CA` (RSA-4096) and hmg is
  # `CN = HMG Root CA` (RSA-2048), different keys signing different brokers. Both are public
  # material — a CA certificate is what the broker hands to anyone who opens a TLS connection.
  #
  # Only the selected one is emitted into the binary; the mapping resolves at config time, so the
  # unused environment costs no flash.
