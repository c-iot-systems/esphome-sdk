# criotive_mqtt.yaml — the MQTT transport: client, topic prefix, availability messages, on_connect.
#
# Owns: the `mqtt:` client, the topic prefix, the birth / last-will / shutdown (availability)
# messages — all derived from ${device_name} — and the on_connect rollback confirmation. Required
# inputs are scoped to THIS module (see the contract in core.yaml): importing criotive_mqtt.yaml
# makes mqtt_broker, mqtt_ca_certificate, mqtt_username and mqtt_password mandatory. None has a
# default — no credential ever ships a default in a public repo. mqtt_port, mqtt_reboot_timeout and
# mqtt_discovery are the optional inputs this module owns; their defaults are declared below.
#
# ── MQTT is TLS ONLY when a CA is configured ──────────────────────────────────────────────────
# Port 8883 does NOT enable TLS. Verified in ESPHome 2026.5.1: mqtt/__init__.py:439 calls
# set_ca_certificate ONLY when `certificate_authority` is present; without it the transport is plain
# TCP whatever the port, so credentials cross the network in the clear. criotive_mqtt.yaml therefore
# wires `certificate_authority` from a REQUIRED mqtt_ca_certificate substitution with no default (see
# ADR-0022). The platform injects the broker's CA when generating the config, so staging and
# production can differ and the CA can rotate without an SDK release.
#
# ── Required-substitution guard ───────────────────────────────────────────────────────────────
# Merely referencing ${x} does not make it required: ESPHome's substitution pass is non-strict, so a
# missing ${x} only warns and leaves the literal in place. Every required input here lands in a
# free-form string field that would accept the literal, so each is wrapped in the guard
# `${ x if x is defined else 1/0 }` — present -> the value unchanged; missing -> a ZeroDivisionError
# re-raised as a hard `esphome config` failure naming the variable. See core.yaml's header and the
# README for the full rationale; tests/negative/ proves each omission fails.
#
# ── Not ported (deprecated — ADR-0021) ────────────────────────────────────────────────────────
# The legacy on_boot MQTT lambda's NVS client-cert loading, the Azure/`were_certs_loaded` fallback
# broker, and the topic MAC suffix are gone: MQTT is the only transport and there is no fallback
# broker path. ADR-0021 covers exactly that NVS/fallback-broker removal. The topic prefix and
# availability messages, which the legacy set imperatively in that lambda, are now declared
# statically from ${device_name}.
#
# ── client_id is set explicitly, and is NOT an ADR-0021 concern ────────────────────────────────
# The one piece of that lambda that IS ported is the EMQX client-id override — as the optional
# `mqtt_client_id` substitution below. This is deliberately separate from ADR-0021: ADR-0021 says
# nothing about MQTT_BROKER_CLIENT_ID, so neither its removal nor its restoration is attributable
# to it. It matters because ESPHome's OWN default is wrong for this broker: left unset,
# mqtt/mqtt_client.cpp:44 sets client_id to `${device_name}-<mac>` (make_name_with_suffix), and two
# independent failures follow. EMQX requires `client_id == username`, so a MAC-suffixed id is
# refused at CONNACK; and the broker mounts `${clientid}/`, the segment the backend reads as
# `cloudId`, so a mismatched id makes telemetry attributed to nothing and silently dropped — not
# just a failed connect. criotive_mqtt.yaml therefore wires `client_id` from `mqtt_client_id`, which
# DEFAULTS to ${device_name} (matching username and topic_prefix for the common case) and is
# overridden per device to a tenant-prefixed id like `00000009d1:toystory1`. client_id and
# topic_prefix stay INDEPENDENT — some devices use a non-prefixed id while keeping the device-name
# topic prefix — so mqtt_client_id is its own override, never derived from the prefix.

substitutions:
  mqtt_port: "8883"
  # OPTIONAL client-id override. Defaults to ${device_name}, so client_id == topic_prefix == the
  # device name for the common case, which is also what EMQX needs (it requires client_id ==
  # username). Override per device with a tenant-prefixed id (e.g. 00000009d1:toystory1) when the
  # broker account expects one. Kept INDEPENDENT of topic_prefix — see the header note and README.
  mqtt_client_id: ${device_name}
  # OFFLINE-SURVIVAL INVARIANT (see core.yaml's header + the README): 0s DISABLES the MQTT reboot
  # outright, so a device rides out a broker/uplink outage instead of power-cycling every timeout.
  # Proven, not assumed — ESPHome 2026.5.1 mqtt/mqtt_client.cpp:418-421:
  #     if (millis() - this->last_connected_ > this->reboot_timeout_ && this->reboot_timeout_ != 0) {
  #       ... App.reboot();
  #     }
  # set_reboot_timeout(0) leaves reboot_timeout_ == 0, so the `!= 0` guard is false and App.reboot()
  # is unreachable. Legacy pinned MQTT_REBOOT_TIMEOUT to 0s for exactly this reason; ESPHome's stock
  # default is 15min (mqtt/__init__.py:285), which the SDK port silently adopted and this restores.
  # Overridable per device, but the DEFAULT must stay 0s — scripts/check-offline-survival.sh fails
  # the build if any reboot_timeout default under modules/ or hardware/ is non-zero.
  mqtt_reboot_timeout: 0s
  mqtt_discovery: "true"

mqtt:
  id: mqtt_client
  broker: "${ mqtt_broker if mqtt_broker is defined else 1/0 }"
  port: ${mqtt_port}
  username: "${ mqtt_username if mqtt_username is defined else 1/0 }"
  password: "${ mqtt_password if mqtt_password is defined else 1/0 }"
  # The TLS trust anchor. Its PRESENCE — not the port — is what makes ESPHome call
  # set_ca_certificate (mqtt/__init__.py:439) and use a TLS socket. Required, no default.
  certificate_authority: "${ mqtt_ca_certificate if mqtt_ca_certificate is defined else 1/0 }"
  reboot_timeout: ${mqtt_reboot_timeout}
  discovery: ${mqtt_discovery}
  discover_ip: false
  # client_id set EXPLICITLY — never left to ESPHome's ${device_name}-<mac> default (mqtt_client.cpp:44)
  # — so it equals the broker username and the ${clientid}/ mountpoint the backend reads as cloudId.
  # Defaults to ${device_name} via mqtt_client_id; override per device. Independent of topic_prefix.
  client_id: ${mqtt_client_id}
  # Topic prefix and the Home Assistant availability messages, all derived from ${device_name}.
  topic_prefix: ${device_name}
  birth_message:
    topic: ${device_name}/status
    payload: online
    qos: 0
    retain: true
  will_message:
    topic: ${device_name}/status
    payload: offline
    qos: 0
    retain: true
  shutdown_message:
    topic: ${device_name}/status
    payload: offline
    qos: 0
    retain: true
  # No MQTT log publishing by default — parity with legacy, which never had a log_topic at all.
  # ESPHome does NOT treat "omit log_topic" as "off": mqtt/__init__.py validate_config re-injects a
  # default `${topic_prefix}/debug` (retain: true) whenever a topic_prefix is set, so simply deleting
  # this key would keep every device streaming its logs to the broker. Disabling requires log_topic to
  # be PRESENT but empty (null): the codegen path (mqtt/__init__.py: `if not log_topic:
  # var.disable_log_message()`) then turns publishing off. `esphome config` on tests/validate/
  # mqtt_ota.yaml proves it — the dumped `mqtt:` shows `log_topic: null`, no /debug topic.
  #
  # Opt-in is a per-device concern: a consumer that wants device logs on the broker adds its own
  # `mqtt: log_topic:` block in its device config (it merges over this null), and MUST set
  # `retain: false` — a rolling log topic where each line overwrites the last must not be retained, or
  # the broker replays one arbitrary stale line to every new subscriber. tests/validate/
  # mqtt_log_optin.yaml exercises that path. See the README.
  log_topic:
  on_connect:
    # Explicit list syntax (a single automation as a list item). On a confirmed MQTT connection,
    # cancel the OTA rollback timer and mark the running image valid: reaching the broker is the
    # health signal that a freshly-flashed firmware works. `script_rollback` is defined in ota.yaml
    # — this cross-module id reference is deliberate (a device that speaks MQTT also takes OTA), and
    # both files ship in the same task so the reference is never split across a boundary.
    - then:
        - delay: 2s
        - lambda: |-
            // esp_ota_mark_app_valid_cancel_rollback is an ESP-IDF API; the Arduino OTA path has no
            // equivalent rollback marker, so this is a no-op there (matches the legacy guard).
            #ifdef USE_ESP_IDF
              if (id(mqtt_client).is_connected()) {
                id(script_rollback).stop();
                esp_ota_mark_app_valid_cancel_rollback();
              }
            #endif
