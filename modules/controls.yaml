# Delays allow MQTT to publish before the device acts.
button:
  - platform: template
    name: "Shutdown"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_shutdown
  - platform: template
    name: "Restart"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_restart
  - platform: template
    name: "Restart (Safe Mode)"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_safe_mode
  - platform: template
    name: "Factory Reset"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_factory

  - platform: shutdown
    name: "Shutdown"
    id: button_shutdown
    internal: true
  - platform: restart
    name: "Restart"
    id: button_restart
    internal: true
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    id: button_safe_mode
    internal: true
  - platform: factory_reset
    name: "Factory Reset"
    id: button_factory
    internal: true
