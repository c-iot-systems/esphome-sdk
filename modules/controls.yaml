# controls.yaml — the four device-lifecycle controls: shutdown, restart, safe-mode, factory-reset.
#
# Owns: the shutdown / restart / safe-mode / factory-reset buttons. Opt-in, no substitution inputs,
# imports nothing.
#
# ── Controls rebuilt from standard ESPHome button platforms ───────────────────────────────────────────
# These controls are built from STANDARD ESPHome button platforms only — no custom component. Each
# user-facing control is a `template` button whose `on_press` waits 500 ms — long enough for the
# button-press state to publish over MQTT — then presses an internal button on the standard
# `shutdown` / `restart` / `safe_mode` / `factory_reset` platform that actually performs the action.
# The internal action buttons are `internal: true`, so only the four template buttons reach the
# exposed API / MQTT surface — exactly the four device-lifecycle controls.
#
# The "Location Request" control is NOT here: it drives the google_location text sensor, so
# it belongs with that component in location.yaml. Keeping it out of controls.yaml is what lets a
# device import controls without also importing location.

button:
  # User-facing controls. Each waits 500 ms so the button-press state can publish over MQTT before
  # the device acts on it, then presses its matching internal action button. Explicit list syntax on
  # every on_press (the automation-list-syntax invariant).
  - platform: template
    name: "Shutdown"
    on_press:
      - then:
          - delay: 500ms  # A little time for MQTT to publish the press
          - button.press: button_shutdown
  - platform: template
    name: "Restart"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_restart
  - platform: template
    name: "Restart (Safe Mode)"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_safe_mode
  - platform: template
    name: "Factory Reset"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_factory

  # Internal action buttons — the standard ESPHome platforms that actually perform each action.
  # internal: true keeps them off the exposed API / MQTT surface; the template buttons above are the
  # only user-facing entry points.
  - platform: shutdown
    name: "Shutdown"
    id: button_shutdown
    internal: true
  - platform: restart
    name: "Restart"
    id: button_restart
    internal: true
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    id: button_safe_mode
    internal: true
  - platform: factory_reset
    name: "Factory Reset"
    id: button_factory
    internal: true
