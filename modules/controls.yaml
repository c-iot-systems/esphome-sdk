# controls.yaml — the four device-lifecycle controls: shutdown, restart, safe-mode, factory-reset.
#
# Owns: the shutdown / restart / safe-mode / factory-reset buttons. Opt-in, no substitution inputs,
# imports nothing.
#
# ── my_button is NOT ported (deprecated — ADR-0021) ───────────────────────────────────────────
# The legacy config exposed these controls through the custom `my_button` component: each my_button
# waited 500 ms — long enough for the button-press state to publish over MQTT — then pressed an
# internal, standard action button. my_button is deprecated, so the SAME behaviour is rebuilt from
# STANDARD ESPHome button platforms only: a `template` button is the user-facing entry point (it owns
# the 500 ms publish delay in its `on_press`), and it presses an internal button on the standard
# `shutdown` / `restart` / `safe_mode` / `factory_reset` platform that actually performs the action.
# No custom component is involved. The internal action buttons are `internal: true`, so only the four
# template buttons reach the exposed API / MQTT surface — exactly the four controls the legacy set.
#
# The legacy "Location Request" my_button is NOT here: it drives the google_location text sensor, so
# it belongs with that component in location.yaml. Keeping it out of controls.yaml is what lets a
# device import controls without also importing location.

button:
  # User-facing controls. Each waits 500 ms so the button-press state can publish over MQTT before
  # the device acts on it, then presses its matching internal action button. Explicit list syntax on
  # every on_press (the automation-list-syntax invariant).
  - platform: template
    name: "Shutdown"
    on_press:
      - then:
          - delay: 500ms  # A little time for MQTT to publish the press
          - button.press: button_shutdown
  - platform: template
    name: "Restart"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_restart
  - platform: template
    name: "Restart (Safe Mode)"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_safe_mode
  - platform: template
    name: "Factory Reset"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_factory

  # Internal action buttons — the standard ESPHome platforms that actually perform each action.
  # internal: true keeps them off the exposed API / MQTT surface; the template buttons above are the
  # only user-facing entry points.
  - platform: shutdown
    name: "Shutdown"
    id: button_shutdown
    internal: true
  - platform: restart
    name: "Restart"
    id: button_restart
    internal: true
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    id: button_safe_mode
    internal: true
  - platform: factory_reset
    name: "Factory Reset"
    id: button_factory
    internal: true
