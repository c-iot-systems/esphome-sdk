# The four operator-facing controls, and the four internal buttons that actually
# do the work.
#
# Each visible button is an `ack_button`, so pressing it from the platform is
# confirmable: it publishes PRESS on its state topic from `press_action()`,
# before the automation below runs. A stock button publishes nothing, which on
# these four is the worst place for it — the device stops answering the instant
# the action lands, so "did the Restart I clicked actually arrive?" has no answer
# after the fact.
#
# The action platforms stay stock and stay `internal: true`. They perform the
# reboot / wipe, which `ack_button` cannot, and internal keeps them off the
# broker entirely: no discovery, no command topic, nothing to acknowledge. The
# visible button is the thing the platform talks to; this is its target.
#
# The visible names all begin with "System" on purpose. ESPHome derives an entity's
# MQTT object_id by sanitizing its name, so these four publish as `system_shutdown`,
# `system_restart`, `system_restart_safe_mode` and `system_factory_reset`.
#
# That `system_` prefix is the public marker for "device system control": an entity a
# consumer should treat as maintenance plumbing rather than as something the end user
# drives. A consumer can therefore recognize all of them with one prefix test instead of
# a hardcoded list of names, and a new system control needs nothing on their side beyond
# carrying the prefix. Renaming one changes its object_id, so treat these names as part
# of the published surface.
external_components:
  - source:
      type: git
      url: https://github.com/c-iot-systems/esphome-sdk
      ref: ${sdk_ref}
    components: [ack_button]

button:
  # The delay is what makes the acknowledgement survive. Publishing it before the
  # automation fixes the ORDER, not the delivery: `publish()` only queues, and
  # every one of these actions kills the MQTT client mid-flight. 500ms lets the
  # loop turn so the packet reaches the socket first.
  - platform: ack_button
    name: "System Shutdown"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_shutdown
  - platform: ack_button
    name: "System Restart"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_restart
  - platform: ack_button
    name: "System Restart Safe Mode"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_safe_mode
  - platform: ack_button
    name: "System Factory Reset"
    on_press:
      - then:
          - delay: 500ms
          - button.press: button_factory

  - platform: shutdown
    name: "Shutdown"
    id: button_shutdown
    internal: true
  - platform: restart
    name: "Restart"
    id: button_restart
    internal: true
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    id: button_safe_mode
    internal: true
  - platform: factory_reset
    name: "Factory Reset"
    id: button_factory
    internal: true
