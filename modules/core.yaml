# core.yaml — the criotive SDK substitution contract + the mandatory device foundation.
#
# core.yaml is the one documented place answering "what must every firmware supply?". It is
# MANDATORY for every device and imports NOTHING: a consumer enumerates exactly the modules it
# needs, because "a device compiles only what it imports" is the whole point of the split. A core
# that pulled in wifi/mqtt/ota would make every device pay for all of them.
#
# ── Substitution contract ────────────────────────────────────────────────────────────────────
# Everything is a YAML substitution (never a C++ preprocessor define — the builder sidecar injects
# no build flags). Names are lower_snake_case. "Required" is scoped to the OWNING module: importing
# a module makes its inputs required; core.yaml never makes another module's inputs globally
# mandatory. No credential substitution has a default — a default password in a public repo is a
# default password in every device that forgot to override it, so a missing credential must fail
# validation loudly.
#
#   | Substitution         | Required | Default | Owner              | Notes                        |
#   |----------------------|----------|---------|--------------------|------------------------------|
#   | device_name          | yes      | —       | core.yaml          | node name; MQTT topic prefix |
#   | firmware_version     | yes      | —       | core.yaml          | published as a text sensor   |
#   | sdk_ref              | yes      | —       | core.yaml (vars)   | see note below               |
#   | logger_level         | no       | NONE    | core.yaml          | prod-off; raise deliberately |
#   | wifi_ssid            | yes      | —       | wifi.yaml          |                              |
#   | wifi_password        | yes      | —       | wifi.yaml          | no default, ever             |
#   | wifi_ap_password     | yes      | —       | wifi.yaml          | fallback AP; no default      |
#   | wifi_reboot_timeout  | no       | 0s      | wifi.yaml          | 0s = reboot DISABLED (offline) |
#   | mqtt_broker          | yes      | —       | criotive_mqtt.yaml |                              |
#   | mqtt_ca_certificate  | yes      | —       | criotive_mqtt.yaml | TLS trust anchor; no default |
#   | mqtt_port            | no       | 8883    | criotive_mqtt.yaml | port alone does NOT enable TLS |
#   | mqtt_username        | yes      | —       | criotive_mqtt.yaml | no default, ever             |
#   | mqtt_password        | yes      | —       | criotive_mqtt.yaml | no default, ever             |
#   | mqtt_reboot_timeout  | no       | 0s      | criotive_mqtt.yaml | 0s = reboot DISABLED (offline) |
#   | mqtt_discovery       | no       | true    | criotive_mqtt.yaml | Home Assistant discovery     |
#   | ota_password         | yes      | —       | ota.yaml           | no default, ever             |
#   | ota_attempts         | no       | 50      | ota.yaml           | safe-mode attempts (legacy)  |
#   | ota_http_server      | yes      | —       | ota.yaml           | HTTPS OTA download host       |
#   | infinite_update_interval | no   | 4294967295ms | core.yaml     | "never auto-publish" idiom   |
#   | infinite_int_value       | no   | 4294967295   | core.yaml     | unbounded max_value idiom    |
#
# sdk_ref: threaded through ESPHome's per-file `vars:` to EVERY module, because ESPHome does not
# propagate a package `ref` into a module's own `external_components:` block. core.yaml and wifi.yaml
# carry no components, so they do not otherwise consume ${sdk_ref}, but core.yaml GUARDS it (in
# esphome.comment below) so a consumer that forgets `vars: {sdk_ref: ...}` fails validation — it is
# required, not merely conventional. check-sdk-ref.sh additionally enforces that every validate
# fixture threads the same ref into the package `ref` and each module's `vars.sdk_ref`.
#
# ── Offline-survival invariant (product requirement — do NOT weaken) ──────────────────────────
# A device MUST keep operating indefinitely while offline, WITHOUT rebooting. Field units (freezer
# monitors, escape-room props) sit on flaky uplinks and must ride out an outage rather than reboot
# through it. Therefore wifi_reboot_timeout AND mqtt_reboot_timeout DEFAULT TO 0s, which disables the
# respective connectivity reboot OUTRIGHT — verified against ESPHome 2026.5.1 source, both components
# guard App.reboot() with `reboot_timeout_ != 0` (wifi/wifi_component.cpp:867, mqtt/mqtt_client.cpp:418),
# so set_reboot_timeout(0) makes the reboot branch unreachable. ESPHome's stock default is 15min for
# both; the SDK restores legacy's 0s. No module may (re)introduce a connectivity-driven reboot — this
# includes ota.yaml's rollback watchdog, which is gated on ESP_OTA_IMG_PENDING_VERIFY so a confirmed,
# long-offline image is never rolled back (see ota.yaml). scripts/check-offline-survival.sh (wired
# into validate.yml) fails the build if any reboot_timeout default under modules/ or hardware/ is
# non-zero, so this cannot silently regress again.
#
# infinite_update_interval / infinite_int_value restore legacy's INFINITE_* idioms as documented
# lower_snake_case substitutions: infinite_update_interval (4294967295ms == 2^32-1 ms, the max uint32
# duration ESPHome accepts) is the "never auto-publish" update_interval — a periodic sensor set to it
# publishes ONLY on an explicit publish_state(); infinite_int_value (4294967295 == 2^32-1) is the
# unbounded max_value / sentinel for numeric fields. core.yaml declares them but does not itself
# consume them; they are provided for consuming device configs (see the README).
#
# This module OWNS: esphome:, device identity, the firmware_version text sensor, the boot counter,
# preferences, logger and sntp time. Optional inputs it owns (logger_level, infinite_update_interval,
# infinite_int_value) get a default below; required inputs it owns (device_name, firmware_version)
# are referenced with NO default.
#
# ── How "required" is enforced ───────────────────────────────────────────────────────────────
# ESPHome 2026.5.1 does NOT hard-fail on an undefined substitution: the substitution pass runs
# non-strict (components/substitutions/__init__.py — do_substitution_pass calls substitute(...,
# strict_undefined=False)), so a missing `${x}` only logs a WARNING and leaves the literal in
# place. `esphome config` then exits 0 unless that leftover literal happens to break a field's
# schema. So referencing a substitution is NOT enough to make it required.
#   - device_name lands in `esphome: name:`, whose identifier schema rejects the leftover
#     `${device_name}` literal, so omitting it already fails — no extra guard needed.
#   - firmware_version, sdk_ref (esphome.comment, below) and wifi.yaml's credentials land in
#     free-form string fields that accept the literal, so each is wrapped in the guard
#     `${ x if x is defined else 1/0 }`: when the value is present the expression returns it
#     unchanged; when it is missing the ZeroDivisionError surfaces as a hard `cv.Invalid` (the
#     non-strict pass demotes UndefinedError to a warning but re-raises every other expression
#     error), so `esphome config` exits non-zero with the offending expression — which names the
#     variable — in the message. tests/negative/ proves each case.

# logger_level defaults to NONE — the production posture. Legacy's ESPHome baseline is
# LOGGER_LEVEL: "NONE" (config/frameworks/esphome/framework_config.json), raised only by opting into
# a named environment (config/environments.json: info/debug/verbose/veryverbose). Parity means the
# default ships silent and a consumer raises it DELIBERATELY per device — logger_level: INFO (or
# DEBUG/VERBOSE/VERY_VERBOSE) — never the SDK shipping every device chatty by default.
substitutions:
  logger_level: NONE
  # Legacy INFINITE_* idioms restored as documented substitutions (see the header + README). Not
  # consumed by core.yaml itself — provided for consuming device configs.
  #   infinite_update_interval: 2^32-1 ms — an update_interval so large a periodic sensor NEVER
  #     auto-publishes; it publishes only on an explicit publish_state() ("never auto-publish").
  #   infinite_int_value: 2^32-1 — an unbounded max_value / sentinel for numeric fields.
  infinite_update_interval: 4294967295ms
  infinite_int_value: "4294967295"

esphome:
  name: ${device_name}
  # Records AND enforces the SDK ref this firmware was built from. sdk_ref is threaded through the
  # per-file `vars:` a consumer passes to every module (ESPHome does not propagate a package ref
  # into a module's own external_components). core.yaml carries no components, so nothing else here
  # consumes it — guarding it in this mandatory module is what makes a consumer that forgets
  # `vars: {sdk_ref: ...}` fail `esphome config` (see the guard-idiom note above), and it doubles as
  # build provenance in the generated config.
  comment: "criotive SDK ${ sdk_ref if sdk_ref is defined else 1/0 }"
  on_boot:
    - priority: 600
      then:
        - text_sensor.template.publish:
            id: firmware_version
            # Guarded: present -> the version; missing -> hard `esphome config` failure (see header).
            state: "${ firmware_version if firmware_version is defined else 1/0 }"
        - lambda: |-
            id(boots_global)++;
            id(sensor_boots).publish_state(id(boots_global));

globals:
  - id: boots_global
    type: int
    restore_value: true
    initial_value: '0'

preferences:
  flash_write_interval: 3s

logger:
  level: ${logger_level}

time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      - then:
          - lambda: |-
              srand(id(sntp_time).utcnow().timestamp);

text_sensor:
  - platform: template
    name: "Firmware Version"
    id: firmware_version
    update_interval: never

sensor:
  - platform: template
    id: sensor_boots
    name: "Boots"
    accuracy_decimals: 0
    update_interval: never
