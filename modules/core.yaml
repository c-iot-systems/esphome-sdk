substitutions:
  logger_level: NONE
  logger_baud_rate: "0" # Serial off by default; frees GPIO1.
  logger_hardware_uart: UART0
  framework_variant: esp-idf
  # Arduino builds must set this to "false".
  ota_rollback: "true"

esphome:
  name: ${device_name}
  # The 1/0 guard makes a missing required value fail validation.
  comment: "criotive SDK ${ sdk_ref if sdk_ref is defined else 1/0 }"
  on_boot:
    - priority: 600
      then:
        - text_sensor.template.publish:
            id: firmware_version
            state: "${ firmware_version if firmware_version is defined else 1/0 }"
        - lambda: |-
            id(boots_global)++;
            id(sensor_boots).publish_state(id(boots_global));

globals:
  - id: boots_global
    type: int
    restore_value: true
    initial_value: '0'

preferences:
  flash_write_interval: 3s

logger:
  level: ${logger_level}
  baud_rate: ${logger_baud_rate}
  hardware_uart: ${logger_hardware_uart}

time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      - then:
          - lambda: |-
              srand(id(sntp_time).utcnow().timestamp);

text_sensor:
  - platform: template
    name: "Firmware Version"
    id: firmware_version
    update_interval: never

sensor:
  - platform: template
    id: sensor_boots
    name: "Boots"
    accuracy_decimals: 0
    update_interval: never
