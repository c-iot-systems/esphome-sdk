name: release

# Compiles every validation fixture against a PUBLISHED tag. This is the belt-and-braces pass:
# the gate that can still stop a bad release is release-gate.yml on main, which runs before the tag
# exists. See AGENTS.md "How a release happens".
on:
  push:
    tags:
      - "v*"
  # release-please creates the tag with GITHUB_TOKEN, and a GITHUB_TOKEN event does not start a
  # workflow run — so an automated release does NOT reach the `push: tags` trigger above. That is
  # covered: release-gate.yml already compiled this exact tree on main. This input keeps the
  # tag-time verification available on demand, and the `push` trigger still fires for a hand-cut tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.5.1"
  SDK_REF: ${{ inputs.tag || github.ref_name }}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Assert a released tag is what we are verifying
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::release.yml must run on a tag, got ref_type='${{ github.ref_type }}'"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${SDK_REF}" >/dev/null; then
            echo "::error::'${SDK_REF}' is not a tag in this repository"
            exit 1
          fi
          echo "Verifying tag: ${SDK_REF}"

      - name: Automation list-syntax gate
        run: |
          bash scripts/check-automation-syntax.sh --self-test
          bash scripts/check-automation-syntax.sh

      - name: SDK ref-consistency gate
        run: |
          bash scripts/check-sdk-ref.sh --self-test
          bash scripts/check-sdk-ref.sh

      - name: OTA rollback-timing gate (safe_mode confirms after the watchdog)
        run: |
          bash scripts/check-rollback-timing.sh --self-test
          bash scripts/check-rollback-timing.sh

      - name: Materialize the released tag into validate fixtures
        run: |
          bash scripts/materialize-sdk-ref.sh --self-test
          bash scripts/materialize-sdk-ref.sh "${SDK_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome ${{ env.ESPHOME_VERSION }}
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: esphome compile over validate fixtures
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/validate/*.yaml tests/validate/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No validate fixtures yet — scaffold has nothing to compile."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "== esphome compile $f =="
            esphome compile "$f"
          done
