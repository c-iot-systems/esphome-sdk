# hds_v2_0_idf — the v2.0 board (ESP32-S3) built on the esp-idf framework.
#
# Concrete hardware values are an invariant, so the framework is a real, separate file rather than a
# ${...} substitution: this file reuses the arduino board file wholesale (same board, variant and the
# full slot pin table) and overrides ONLY esp32.framework to esp-idf. A device imports either
# hds_v2_0.yaml (arduino) or this file (esp-idf), never both.
#
# The base is pulled in as a package so the pin table lives in exactly one place (hds_v2_0.yaml) and
# the two framework variants can never drift. The top-level esp32: below merges OVER the base
# package, replacing only framework.type while keeping board/variant.
#
# Framework consequence: the OTA rollback watchdog in ota.yaml is compiled inside #ifdef USE_ESP_IDF,
# so it is ACTIVE on this esp-idf build (and compiled out of the arduino build). See the README.
packages:
  hardware_base: !include hds_v2_0.yaml

esp32:
  framework:
    type: esp-idf
