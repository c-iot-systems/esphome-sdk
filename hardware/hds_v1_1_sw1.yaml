# hds_v1_1_sw1.yaml — the v1.1 on-board push button (SW1), as an OPT-IN unit.
#
# SW1 is wired to GPIO1, which is the ESP32's U0TXD (primary UART TX) line. Declaring SW1 as a GPIO
# input hands GPIO1 to the button and therefore silences serial-console logging on this board — a
# trade-off a device must accept deliberately. So the button is NOT in hds_v1_1.yaml; a device opts
# in by ALSO importing this file. A device that needs serial logs simply omits it and GPIO1 stays on
# the UART. (A substitution cannot conditionally drop a YAML block, which is why this is a separate
# importable file rather than a toggle.)
#
# SW1 drives the STANDARD lifecycle buttons from controls.yaml (button_restart / button_factory) by
# id — the button reaches into the module's public ids, not the reverse — so a device that imports
# this file MUST also import controls.yaml, or the id references do not resolve.
#
# on_click uses the explicit list form (three separate click-length windows, each its own
# automation) so package merging keeps all three rather than collapsing them into one — see the
# automation-list-syntax gate.
binary_sensor:
  - platform: gpio
    pin: 1
    name: "SW1"
    internal: true
    filters:
      - invert
    on_click:
      - min_length: 100ms
        max_length: 2s
        then:
          - logger.log: "Rebooting"
          - delay: 1s
          - button.press: button_restart
      - min_length: 2s
        max_length: 10s
        then:
          - logger.log: "WiFi Manager"
          - delay: 1s
          - button.press: button_factory  # TODO: start captive instead.
      - min_length: 20s
        max_length: 1000s
        then:
          - logger.log: "Factory"
          - delay: 1s
          - button.press: button_factory
