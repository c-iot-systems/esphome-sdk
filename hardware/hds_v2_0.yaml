# hds_v2_0 — concrete board definition + pin map for the v2.0 board (ESP32-S3).
#
# Board and variant are CONCRETE (esp32-s3-devkitc-1 / esp32s3) — never ${DEVICE_BOARD}/
# ${DEVICE_VARIANT} templating. The build FRAMEWORK is the one esp32 field that varies per device, so
# it is consumed as ${framework_variant} (default esp-idf, declared in modules/core.yaml) inside this
# file's own esp32.framework — one board file serves both the esp-idf and arduino builds instead of a
# doubled _idf sibling. A device selects the arduino toolchain with framework_variant: arduino.
#
# The v2.0 board declares no fixed board I/O: no CAN termination switch, no on-board button and no
# indicator LEDs, so this file owns no board-level component and no OTA visual feedback. It DOES
# carry module slots, so the slot pin table below applies.
#
# ── Serial console / logger ───────────────────────────────────────────────────────────────────
# The serial console is OFF by default (modules/core.yaml sets logger_baud_rate: 0, which skips UART
# init). Unlike the classic-ESP32 boards this ESP32-S3 has no serial-console-vs-GPIO conflict: set
# logger_hardware_uart: USB_SERIAL_JTAG (an S3-only option) together with a real, non-zero
# logger_baud_rate and a non-NONE logger_level, and the console uses the built-in USB peripheral — no
# UART pins — so no board GPIO is taken. logger_level and logger_baud_rate stay independent (level
# gates record production, baud_rate gates console init); see modules/core.yaml.
#
# ── Slot pin table (slot_<n>_<module>_<signal>) ───────────────────────────────────────────────
# This board carries seven module slots. Each substitution below resolves ONE module signal, for a
# given module placed in a given slot, to the physical GPIO that signal lands on. A consumer that
# wires, say, a Double Relay into slot 3 references ${slot_3_double_relay_relay_1} as that relay's
# pin. The values are static: they were read directly from the board's slot/module data (the physical
# per-slot GPIO table and each module's signal-to-lane mapping) and only combinations that physically
# fit the board are listed. The SDK CANNOT check that a slot actually holds the module a name refers
# to — it never sees a device's populated slot map — so choosing the right name for the module a slot
# really holds is the consumer's responsibility (see the README).
