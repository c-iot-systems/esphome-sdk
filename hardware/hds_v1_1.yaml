esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: ${framework_variant}
    advanced:
      # Arduino builds require ota_rollback: "false".
      enable_ota_rollback: ${ota_rollback}

switch:
  - platform: gpio
    pin: 12
    name: "CAN Resistor"
    internal: true
    restore_mode: ${can_resistor_status}

binary_sensor:
  - platform: gpio
    id: sw1_button
    pin: 1
    name: "SW1"
    internal: true
    filters:
      - invert
    on_click:
      - min_length: 100ms
        max_length: 2s
        then:
          - logger.log: "Rebooting"
          - delay: 1s
          - button.press: button_restart
      - min_length: 2s
        max_length: 10s
        then:
          - logger.log: "WiFi Manager"
          - delay: 1s
          - button.press: button_factory  # TODO: start captive instead.
      - min_length: 20s
        max_length: 1000s
        then:
          - logger.log: "Factory"
          - delay: 1s
          - button.press: button_factory
  # Frees GPIO1 for UART0. Compares against the falsy spellings rather than
  # testing truthiness: substitutions supplied by a consumer are often strings
  # (ESPHome's own `-s` always is), and the string "false" is truthy -- so a
  # truthiness test left SW1 enabled and the console silent, with no error.
  - id: !remove '${"sw1_button" if hds_v1_1_sw1_enabled | string | lower in ["false", "0", ""] else false}'
