esp32:
  board: esp32dev
  variant: esp32
  framework:
    # Board and variant are concrete; only the framework varies per device. Default esp-idf (see
    # modules/core.yaml); override framework_variant: arduino to build against arduino. Substitution
    # runs before schema validation, so ${framework_variant} resolves to a literal the esp32 schema
    # then checks — the same pattern can_resistor_status already uses.
    type: ${framework_variant}
    advanced:
      # Pin OTA rollback support ON so the ota.yaml watchdog stays armed on esp-idf (defines
      # USE_OTA_ROLLBACK + CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE, deferring boot-time confirmation to
      # safe_mode). ESPHome's default when safe_mode is present; pinned so a default change can't
      # silently disarm it. No effect on an arduino build. See hds_v1_0.yaml / the README for detail.
      enable_ota_rollback: true

switch:
  - platform: gpio
    pin: 12
    name: "CAN Resistor"
    internal: true
    restore_mode: ${can_resistor_status}
