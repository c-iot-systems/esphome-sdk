# hds_v1_1 — concrete board definition + pin map for the v1.1 board.
#
# Board and variant are CONCRETE (esp32dev / esp32) — never ${DEVICE_BOARD}/${DEVICE_VARIANT}
# templating. The build FRAMEWORK is the one esp32 field that varies per device, so it is consumed
# as ${framework_variant} (default esp-idf, declared in modules/core.yaml) inside this file's own
# esp32.framework — one board file serves both the esp-idf and arduino builds instead of a doubled
# _idf sibling. A device selects the arduino toolchain with framework_variant: arduino.
#
# This board has no indicator LEDs, so it ships no OTA visual feedback (no module reaches into a
# hardware id either way).
#
# Fixed pin map:
#   CAN RESISTOR -> GPIO12   (CAN bus termination resistor)
#
# ── SW1 is opt-in, and is NOT wired here ──────────────────────────────────────────────────────
# This board has an on-board push button (SW1) on GPIO1. GPIO1 is the ESP32's U0TXD line, so
# configuring SW1 as a GPIO input takes over the primary UART's TX pin and silences serial-console
# logging on the board. That trade-off must be a deliberate per-device choice, so SW1 is NOT wired
# in this board file — it lives in the importable unit hds_v1_1_sw1.yaml. A device that wants the
# button imports that file (and controls.yaml, whose buttons SW1 presses); a device that wants
# serial logs simply does not, and GPIO1 stays free. A substitution cannot conditionally omit a YAML
# block, so the split into a second file is the only way to make the button genuinely optional. See
# the README's "SW1 / GPIO1" note.
#
# can_resistor_status selects the CAN termination restore mode. Only the two endpoint nodes of a CAN
# segment should terminate; a node wired mid-bus must set ALWAYS_OFF or it corrupts the bus.
# Default ALWAYS_ON matches most deployments; a consumer overrides it per device.
#
# ── Slot pin table (slot_<n>_<module>_<signal>) ───────────────────────────────────────────────
# This board carries seven module slots. Each substitution below resolves ONE module signal, for a
# given module placed in a given slot, to the physical GPIO that signal lands on. A consumer that
# wires, say, a Double Relay into slot 3 references ${slot_3_double_relay_relay_1} as that relay's
# pin. The values are static: they were read directly from the board's slot/module data (the physical
# per-slot GPIO table and each module's signal-to-lane mapping) and only combinations that physically
# fit the board are listed. The SDK CANNOT check that a slot actually holds the module a name refers
# to — it never sees a device's populated slot map — so choosing the right name for the module a slot
# really holds is the consumer's responsibility (see the README).
substitutions:
  can_resistor_status: ALWAYS_ON
  slot_1_triple_digital_input_in1: "23"
  slot_1_triple_digital_input_in2: "16"
  slot_1_triple_digital_input_in3: "4"
  slot_1_level_shifter_io1: "23"
  slot_1_level_shifter_io2: "16"
