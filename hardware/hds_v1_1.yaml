esp32:
  board: esp32dev
  variant: esp32
  framework:
    # Board and variant are concrete; only the framework varies per device. Default esp-idf (see
    # modules/core.yaml); override framework_variant: arduino to build against arduino. Substitution
    # runs before schema validation, so ${framework_variant} resolves to a literal the esp32 schema
    # then checks — the same pattern can_resistor_status already uses.
    type: ${framework_variant}
    advanced:
      # OTA rollback support, driven by ${ota_rollback} (default true). On esp-idf this defines
      # USE_OTA_ROLLBACK + CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE, deferring boot-time confirmation to
      # safe_mode (the deferral ota.yaml's watchdog needs). ESPHome emits it on BOTH frameworks, but
      # the SDK's watchdog + MQTT confirm are #ifdef USE_ESP_IDF, so an arduino device MUST pair
      # framework_variant: arduino with ota_rollback: false — see hds_v1_0.yaml / core.yaml / README.
      enable_ota_rollback: ${ota_rollback}

switch:
  - platform: gpio
    pin: 12
    name: "CAN Resistor"
    internal: true
    restore_mode: ${can_resistor_status}

binary_sensor:
  # On-board SW1 button on GPIO1 (U0TXD). Declared unconditionally with a stable id; the !remove item
  # below drops it when hds_v1_1_sw1_enabled is false (see the header). on_click uses the explicit
  # list form (three separate click-length windows, each its own automation) so package merging keeps
  # all three rather than collapsing them into one — see the automation-list-syntax gate. SW1's
  # handlers press button_restart / button_factory (owned by controls.yaml, by id), so a device that
  # keeps SW1 enabled MUST also import controls.yaml or the id references do not resolve.
  - platform: gpio
    id: sw1_button
    pin: 1
    name: "SW1"
    internal: true
    filters:
      - invert
    on_click:
      - min_length: 100ms
        max_length: 2s
        then:
          - logger.log: "Rebooting"
          - delay: 1s
          - button.press: button_restart
      - min_length: 2s
        max_length: 10s
        then:
          - logger.log: "WiFi Manager"
          - delay: 1s
          - button.press: button_factory  # TODO: start captive instead.
      - min_length: 20s
        max_length: 1000s
        then:
          - logger.log: "Factory"
          - delay: 1s
          - button.press: button_factory
  # Compile-time SW1 opt-out. Resolves to `!remove sw1_button` when hds_v1_1_sw1_enabled is false
  # (dropping SW1 above and freeing GPIO1); when true it resolves to the string "false", which matches
  # no id, so the removal is a silent no-op and SW1 stays. The flag MUST be an unquoted boolean.
  - id: !remove '${not hds_v1_1_sw1_enabled and "sw1_button"}'
