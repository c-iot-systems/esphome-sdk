esp32:
  board: pico32
  variant: esp32
  framework:
    # Board and variant are concrete; only the framework varies per device. Default esp-idf (see
    # modules/core.yaml); override framework_variant: arduino to build against arduino. Substitution
    # is textual and runs BEFORE schema validation, so ${framework_variant} resolves to a literal
    # framework name the esp32 schema then checks — the same pattern can_resistor_status already uses.
    type: ${framework_variant}
    advanced:
      # OTA rollback support, driven by ${ota_rollback} (default true; see modules/core.yaml). On
      # esp-idf this defines USE_OTA_ROLLBACK + CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE, which defers
      # the boot-time image confirmation to safe_mode — esp32/hal.cpp guards its immediate
      # esp_ota_mark_app_valid_cancel_rollback() with #ifndef USE_OTA_ROLLBACK — the deferral
      # ota.yaml's rollback watchdog depends on. ESPHome emits this on BOTH frameworks (not just
      # esp-idf), but the SDK's watchdog and MQTT confirmation are #ifdef USE_ESP_IDF, so an arduino
      # device MUST pair framework_variant: arduino with ota_rollback: false — otherwise confirmation
      # is deferred with no watchdog and no broker cancel and a healthy fresh image could roll back.
      # With ota_rollback: false, USE_OTA_ROLLBACK is undefined and rollback exists only on esp-idf.
      enable_ota_rollback: ${ota_rollback}

switch:
  - platform: gpio
    pin: 12
    name: "CAN Resistor"
    internal: true
    restore_mode: ${can_resistor_status}
