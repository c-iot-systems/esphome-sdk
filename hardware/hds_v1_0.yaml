# hds_v1_0 — concrete board definition + pin map for the v1.0 board (arduino framework).
#
# A hardware file owns the platform component (esp32:) and the board-specific I/O. Board, variant
# and framework are CONCRETE here — never ${DEVICE_BOARD}/${DEVICE_VARIANT} templating. The esp-idf
# build of this same board is hds_v1_0_idf.yaml, which reuses everything here and only swaps the
# framework; a device imports exactly one of the two.
#
# This board has no indicator LEDs, so it ships no OTA visual feedback. The rule still holds: a
# hardware file WITH LEDs would drive its own OTA feedback by its own ids, and no module reaches
# into a hardware id.
#
# Fixed pin map:
#   CAN RESISTOR -> GPIO12   (CAN bus termination resistor)
#
# can_resistor_status selects the termination restore mode. Only the two endpoint nodes of a CAN
# segment should terminate; a node wired mid-bus must set ALWAYS_OFF or it corrupts the bus.
# Default ALWAYS_ON matches most deployments; a consumer overrides it per device.
#
# ── Slot pin table (slot_<n>_<module>_<signal>) ───────────────────────────────────────────────
# This board carries seven module slots. Each substitution below resolves ONE module signal, for a
# given module placed in a given slot, to the physical GPIO that signal lands on. A consumer that
# wires, say, a Double Relay into slot 3 references ${slot_3_double_relay_relay_1} as that relay's
# pin. The values are static: they were read directly from the board's slot/module data (the physical
# per-slot GPIO table and each module's signal-to-lane mapping) and only combinations that physically
# fit the board are listed. The SDK CANNOT check that a slot actually holds the module a name refers
# to — it never sees a device's populated slot map — so choosing the right name for the module a slot
# really holds is the consumer's responsibility (see the README).
substitutions:
  can_resistor_status: ALWAYS_ON
  slot_1_triple_digital_input_in1: "7"
  slot_1_triple_digital_input_in2: "8"
  slot_1_triple_digital_input_in3: "37"
  slot_1_level_shifter_io1: "7"
  slot_1_level_shifter_io2: "8"
  slot_1_level_shifter_in3: "37"
  slot_1_double_relay_relay_1: "8"
  slot_1_double_relay_relay_2: "7"
