# hds_v1_0 — concrete board definition + pin map, ported from legacy config/hardwares/ciot_v1_0.
#
# A hardware file owns the platform component (esp32:) and the board-specific I/O. Board, variant
# and framework are CONCRETE here — never ${DEVICE_BOARD}/${DEVICE_VARIANT} templating. The legacy
# board came from ciot_v1_0/hardware_config.json (pico32 / esp32 / arduino).
#
# This board has no indicator LEDs, so it owns no OTA visual feedback (the legacy LED animation was
# gated on #ifdef HARDWARE_FREEZER — a different board — and is not ported). The rule still holds:
# if a hardware file had LEDs it would drive its own OTA feedback, and no module reaches into a
# hardware id.
#
# Pin map (legacy ciot_v1_0 core.json fixed "Power" slot):
#   CAN RESISTOR -> GPIO12   (CAN bus termination; ALWAYS_ON so the segment is always terminated)
esp32:
  board: pico32
  variant: esp32
  framework:
    type: arduino

switch:
  - platform: gpio
    pin: 12
    name: "CAN Resistor"
    internal: true
    restore_mode: ALWAYS_ON
