substitutions:
  device_name: hds-v1-0-slots
  firmware_version: "0.0.0-test"
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password
  wifi_ap_password: test-ap-password

binary_sensor:
  - platform: gpio
    pin:
      number: ${slot_1_triple_digital_input_in1}
      ignore_pin_validation_error: true
    name: "slot_1_triple_digital_input_in1"
    internal: true
  - platform: gpio
    pin:
      number: ${slot_1_level_shifter_io2}
      ignore_pin_validation_error: true
    name: "slot_1_level_shifter_io2"
    internal: true
  - platform: gpio
    pin:
      number: ${slot_1_audio_tx_dat}
      ignore_pin_validation_error: true
    name: "slot_1_audio_tx_dat"
    internal: true
  - platform: gpio
    pin:
      number: ${slot_1_io_expander_keyscan_5x5_scl}
      ignore_pin_validation_error: true
    name: "slot_1_io_expander_keyscan_5x5_scl"
    internal: true
  - platform: gpio
    pin:
      number: ${slot_3_double_relay_relay_1}
      ignore_pin_validation_error: true
    name: "slot_3_double_relay_relay_1"
    internal: true
  - platform: gpio
    pin:
      number: ${slot_3_h_bridge_out_2}
      ignore_pin_validation_error: true
    name: "slot_3_h_bridge_out_2"
    internal: true
  - platform: gpio
    pin:
      number: ${slot_4_io_expander_keyscan_10x8_sda}
      ignore_pin_validation_error: true
    name: "slot_4_io_expander_keyscan_10x8_sda"
    internal: true

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: hardware/hds_v1_0.yaml
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
