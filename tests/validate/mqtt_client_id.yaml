# Fixture: mqtt_client_id set DIFFERENT from device_name — proves client_id and topic_prefix stay
# independent, so a broker with client-id rules is satisfied without moving the topic prefix.
substitutions:
  device_name: mqtt-clientid-testdev
  mqtt_client_id: "custom-client-id-01"
  firmware_version: "0.0.0-test"
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password
  wifi_ap_password: test-ap-password
  criotive_env: hmg
  mqtt_username: "custom-client-id-01"
  mqtt_password: test-mqtt-password
  ota_password: test-ota-password
  ota_http_server: ota.test.invalid/blobs/

esp32:
  board: esp32dev
  framework:
    type: arduino

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/criotive_mqtt.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ota.yaml
        vars: {sdk_ref: __SDK_REF__}
