esphome:
  name: medeawiz-testdev

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

uart:
  - id: sprite_uart
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

medeawiz:
  - id: video_player
    uart_id: sprite_uart

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: modules/medeawiz.yaml
        vars: {sdk_ref: __SDK_REF__}
