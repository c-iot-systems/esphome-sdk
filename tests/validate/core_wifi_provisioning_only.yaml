# Fixture: core + wifi with NO station slot — the provisioning-only device, reached via the fallback
# AP and captive portal. wifi_ap_password stays required: it is the only way in.
substitutions:
  device_name: core-wifi-provisioning-testdev
  firmware_version: "0.0.0-test"
  wifi_ap_password: test-ap-password

esp32:
  board: esp32dev
  framework:
    type: arduino

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
