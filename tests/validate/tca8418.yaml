esphome:
  name: tca8418-testdev

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

i2c:
  sda: GPIO21
  scl: GPIO22

tca8418:
  - id: pin_expander
    address: 0x34

binary_sensor:
  - platform: gpio
    name: "Expander button"
    pin:
      tca8418: pin_expander
      number: 8
      mode:
        input: true
        pullup: true
      inverted: true

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: modules/tca8418.yaml
        vars: {sdk_ref: __SDK_REF__}
