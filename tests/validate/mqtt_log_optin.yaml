# Fixture: the MQTT log-publishing OPT-IN — a consumer log_topic: block merges over the module's
# null. retain: false is mandatory; a retained log topic replays a stale line to every subscriber.
substitutions:
  device_name: mqtt-log-optin-testdev
  firmware_version: "0.0.0-test"
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password
  wifi_ap_password: test-ap-password
  criotive_env: prod
  mqtt_username: test-mqtt-user
  mqtt_password: test-mqtt-password
  ota_password: test-ota-password
  ota_http_server: ota.test.invalid/blobs/
  logger_level: INFO

esp32:
  board: esp32dev
  framework:
    type: arduino

mqtt:
  log_topic:
    topic: ${device_name}/debug
    qos: 0
    retain: false

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/criotive_mqtt.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ota.yaml
        vars: {sdk_ref: __SDK_REF__}
