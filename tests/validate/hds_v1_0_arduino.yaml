# Positive validate fixture for the hds_v1_0 board built on the ARDUINO framework — the non-default
# framework. It imports the same single hds_v1_0 board file as tests/validate/hds_v1_0.yaml but
# overrides framework_variant: arduino, so this is the fixture that EXERCISES the ${framework_variant}
# substitution rather than merely declaring its default. The default (esp-idf) path is covered by the
# plain hds_v1_0 / hds_v1_1 / hds_v2_0 fixtures; this one proves the arduino override validates and,
# on release, compiles.
#
# Framework consequence: on arduino the ota.yaml rollback watchdog (#ifdef USE_ESP_IDF) is compiled
# OUT — there is no ESP-IDF rollback API on that path — so an arduino build carries no post-OTA
# rollback protection (see the README OTA + framework sections). The enable_ota_rollback pin in the
# board file is a no-op here (emitted only on the esp-idf toolchain), which is exactly why carrying it
# in the shared board file is safe.
#
# CI materializes the __SDK_REF__ placeholder (see tests/validate/README.md); check-sdk-ref.sh asserts
# the package ref and every vars.sdk_ref are the placeholder.
#
# Self-contained: literal test values for every required substitution. The repo is public, so no value
# here is a real credential — mqtt_ca_certificate is a stand-in, not a real CA.
substitutions:
  device_name: hds-v1-0-arduino-testdev
  firmware_version: "0.0.0-test"
  framework_variant: arduino
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password
  wifi_ap_password: test-ap-password
  mqtt_broker: mqtt.test.invalid
  mqtt_username: test-mqtt-user
  mqtt_password: test-mqtt-password
  mqtt_ca_certificate: "-----BEGIN CERTIFICATE-----\nTESTCA\n-----END CERTIFICATE-----"
  ota_password: test-ota-password
  ota_http_server: ota.test.invalid/blobs/

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: hardware/hds_v1_0.yaml
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/criotive_mqtt.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ota.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/diagnostics.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/controls.yaml
        vars: {sdk_ref: __SDK_REF__}
