# Fixture: the phone driver as a 4x3 telephone keypad — the key count must equal rows * columns.
# Self-contained rather than importing core, since the driver needs no network. Release CI compiles it.
esphome:
  name: phone-testdev

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

phone:
  - id: prop_phone
    rows:
      - pin: GPIO4
      - pin: GPIO5
      - pin: GPIO18
      - pin: GPIO19
    columns:
      - pin:
          number: GPIO21
          mode:
            input: true
            pullup: true
      - pin:
          number: GPIO22
          mode:
            input: true
            pullup: true
      - pin:
          number: GPIO23
          mode:
            input: true
            pullup: true
    keys: "123456789*0#"

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: modules/phone.yaml
        vars: {sdk_ref: __SDK_REF__}
