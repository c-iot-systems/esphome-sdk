# Fixture: the console-ON path — logger_level and logger_baud_rate at NON-default values. It rides
# hds_v1_0, which has no SW1, so opening the UART console costs nothing: on hds_v1_1 the console and
# the GPIO1 button are mutually exclusive. logger_hardware_uart is pinned to its default UART0 on
# purpose — UART1/UART2's default pins are wired to flash on these modules and the logger schema
# exposes no tx_pin override, so UART0 is the only console a classic ESP32 board can actually use.
substitutions:
  device_name: logger-console-testdev
  firmware_version: "0.0.0-test"
  logger_level: INFO
  logger_baud_rate: "115200"
  logger_hardware_uart: UART0
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password
  wifi_ap_password: test-ap-password
  mqtt_broker: mqtt.test.invalid
  mqtt_port: "8883"
  mqtt_username: test-mqtt-user
  mqtt_password: test-mqtt-password
  mqtt_ca_certificate: "-----BEGIN CERTIFICATE-----\nTESTCA\n-----END CERTIFICATE-----"
  ota_password: test-ota-password
  ota_http_server: ota.test.invalid/blobs/

packages:
  criotive:
    url: https://github.com/c-iot-systems/esphome-sdk
    ref: __SDK_REF__
    files:
      - path: hardware/hds_v1_0.yaml
      - path: modules/core.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/wifi.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/criotive_mqtt.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/ota.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/diagnostics.yaml
        vars: {sdk_ref: __SDK_REF__}
      - path: modules/controls.yaml
        vars: {sdk_ref: __SDK_REF__}
