# NEGATIVE — MUST FAIL. Slot 1 is complete and valid; slot 2 sets wifi_password_2 with no
# wifi_ssid_2. Proves the all-or-nothing rule is enforced per slot, not only on the first one — a
# half-filled extra slot must not be silently dropped just because the device has a usable network.
substitutions:
  device_name: neg-device
  firmware_version: "0.0.0-test"
  wifi_ssid: test-ssid
  wifi_password: test-wifi-password
  # wifi_ssid_2 intentionally omitted — the slot-2 password below has no SSID to pair with
  wifi_password_2: test-wifi-password-2
  wifi_ap_password: test-ap-password

esp32:
  board: esp32dev
  framework:
    type: arduino

packages:
  core: !include { file: ../../modules/core.yaml, vars: {sdk_ref: local-test} }
  wifi: !include { file: ../../modules/wifi.yaml, vars: {sdk_ref: local-test} }
