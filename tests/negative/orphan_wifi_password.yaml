# NEGATIVE — MUST FAIL. Sets wifi_password with NO wifi_ssid (slot 1 half-filled). The station
# slots are optional, but each slot is all-or-nothing: wifi.yaml's networks expression raises on a
# password whose SSID is empty. Proves a forgotten or mistyped SSID name still fails loudly instead
# of silently shipping a device with an unusable credential and no network.
substitutions:
  device_name: neg-device
  firmware_version: "0.0.0-test"
  # wifi_ssid intentionally omitted — the password below has no SSID to pair with
  wifi_password: test-wifi-password
  wifi_ap_password: test-ap-password

esp32:
  board: esp32dev
  framework:
    type: arduino

packages:
  core: !include { file: ../../modules/core.yaml, vars: {sdk_ref: local-test} }
  wifi: !include { file: ../../modules/wifi.yaml, vars: {sdk_ref: local-test} }
